# linksterr-node configuration. Run:  linksterr-node.exe --config node.ini
# Command-line switches override anything here.

# Concurrent connections this PC may carry per account (1-64).
max_streams = 16

# Coordinator. Leave as is.
# server = wss://node.ipsterr.com

# One [account] section per Linksterr account. The key comes from your
# Linksterr dashboard; the label is only shown in this PC's log.
[account]
key = PASTE-YOUR-NODE-KEY-HERE
label = you@example.com

# [account]
# key = ANOTHER-KEY
# label = second account
